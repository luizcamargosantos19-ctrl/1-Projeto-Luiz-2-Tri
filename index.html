<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroSoja Brasil</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f4f4;
}

header{
    background:#1b5e20;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    background:#2e7d32;
    padding:10px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-weight:bold;
}

.container{
    width:90%;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

input, select{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    background:#1b5e20;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#145a18;
}

#resultado{
    margin-top:15px;
    font-weight:bold;
    color:#1b5e20;
}

footer{
    text-align:center;
    background:#1b5e20;
    color:white;
    padding:15px;
}
</style>
</head>

<body>

<header>
    <h1>🌱 AgroSoja Brasil</h1>
    <p>Compra, venda e comercialização de soja</p>
</header>

<nav>
    <a href="#cotacao">Cotação</a>
    <a href="#vendas">Vendas</a>
    <a href="#consulta">Consultas</a>
</nav>

<div class="container">

    <div class="card" id="cotacao">
        <h2>Cotação de Soja</h2>

        <select id="estado">
            <option value="128">Paraná</option>
            <option value="126">Mato Grosso</option>
            <option value="130">Rio Grande do Sul</option>
        </select>

        <button onclick="consultarPreco()">
            Consultar Preço
        </button>

        <div id="resultado"></div>
    </div>

    <div class="card" id="vendas">
        <h2>Simulador de Venda</h2>

        <label>Quantidade de Sacas</label>
        <input type="number" id="sacas">

        <button onclick="calcularVenda()">
            Calcular Valor
        </button>

        <div id="valorVenda"></div>
    </div>

    <div class="card" id="consulta">
        <h2>Solicitar Consulta Comercial</h2>

        <input type="text" id="nome" placeholder="Nome">

        <input type="email" id="email" placeholder="E-mail">

        <button onclick="enviarConsulta()">
            Enviar
        </button>

        <div id="mensagem"></div>
    </div>

</div>

<footer>
    © 2026 AgroSoja Brasil
</footer>

<script>

let precoAtual = 128;

</body>
</html>
